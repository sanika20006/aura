<!DOCTYPE html>
<html>
<head>
    <title>Self Care - Aura</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container dashboard">
    <h1>🧘 Self Care Tools</h1>

    <!-- Guided Breathing -->
    <div class="card">
        <h2>Guided Breathing (Box 4-4-4-4)</h2>

        <div id="breathingCircle"></div>
        <h3 id="breathText">Ready?</h3>
        <button onclick="startBreathing()">Start</button>
    </div>

    <!-- Self Care Checklist -->
    <div class="card">
        <h2>Daily Self-Care Checklist</h2>

        <label><input type="checkbox" onchange="saveChecklist()" id="water"> Stay Hydrated</label><br><br>
        <label><input type="checkbox" onchange="saveChecklist()" id="sleep"> 7 Hr Sleep</label><br><br>
        <label><input type="checkbox" onchange="saveChecklist()" id="exercise"> Exercise</label><br><br>
        <label><input type="checkbox" onchange="saveChecklist()" id="break"> Take Break From Scrolling</label>
    </div>

    <div class="card" onclick="window.location.href='dashboard.html'">
        ⬅ Back to Dashboard
    </div>
</div>

<style>
#breathingCircle {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    background: rgba(255,255,255,0.3);
    margin: 20px auto;
    transition: all 4s ease-in-out;
}
</style>

<script>

// BOX BREATHING LOGIC
let phase = 0;
let breathingInterval;

function startBreathing() {
    clearInterval(breathingInterval);
    phase = 0;
    breathingInterval = setInterval(runBreathing, 4000);
    runBreathing();
}

function runBreathing() {

    const circle = document.getElementById("breathingCircle");
    const text = document.getElementById("breathText");

    if (phase === 0) {
        text.innerText = "Inhale";
        circle.style.transform = "scale(1.5)";
    }
    else if (phase === 1) {
        text.innerText = "Hold";
    }
    else if (phase === 2) {
        text.innerText = "Exhale";
        circle.style.transform = "scale(1)";
    }
    else if (phase === 3) {
        text.innerText = "Hold";
    }

    phase = (phase + 1) % 4;
}

// CHECKLIST SAVE
function saveChecklist() {

    const checklist = {
        water: document.getElementById("water").checked,
        sleep: document.getElementById("sleep").checked,
        exercise: document.getElementById("exercise").checked,
        break: document.getElementById("break").checked
    };

    localStorage.setItem("checklist", JSON.stringify(checklist));
}

// LOAD CHECKLIST WHEN PAGE OPENS
window.onload = function() {

    const saved = JSON.parse(localStorage.getItem("checklist"));

    if(saved){
        document.getElementById("water").checked = saved.water;
        document.getElementById("sleep").checked = saved.sleep;
        document.getElementById("exercise").checked = saved.exercise;
        document.getElementById("break").checked = saved.break;
    }
}

</script>

</body>
</html>
