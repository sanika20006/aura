<!DOCTYPE html>
<html>
<head>
    <title>Gratitude Journal - Aura</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container dashboard">
    <h1>📔 Gratitude Journal</h1>

    <!-- Quotes Section -->
    <div class="card">
        <h2>🌿 Gratitude Reminder</h2>
        <p id="quoteText"></p>
    </div>

    <!-- Journal Writing Section -->
    <div class="card">
        <h2>Reflect On Your Day</h2>

        <textarea id="journalEntry" rows="8" style="
            width:100%;
            padding:10px;
            border-radius:10px;
            border:none;
            resize:none;
        " placeholder="What are you grateful for today? What did you learn? What challenged you?"></textarea>

        <br><br>

        <button onclick="saveJournal()">Save Entry</button>
    </div>

    <!-- Streak Section -->
    <div class="card">
        <h2>🔥 Consistency Streak</h2>
        <h3 id="streakCount">0 Days</h3>
    </div>

    <div class="card" onclick="window.location.href='dashboard.html'">
        ⬅ Back to Dashboard
    </div>
</div>

<script>

// -------- GRATITUDE QUOTES --------
const quotes = [
    "Gratitude turns what we have into enough.",
    "Small daily gratitude rewires the mind.",
    "The more you appreciate, the more life gives.",
    "Grateful hearts attract peaceful minds.",
    "Notice the little joys today."
];

function loadQuote() {
    const random = Math.floor(Math.random() * quotes.length);
    document.getElementById("quoteText").innerText = quotes[random];
}

// -------- SAVE JOURNAL --------
function saveJournal() {

    const text = document.getElementById("journalEntry").value;

    if(text.trim() === ""){
        alert("Write something before saving.");
        return;
    }

    const today = new Date().toDateString();

    let journals = JSON.parse(localStorage.getItem("journals")) || [];
    journals.push({ date: today, content: text });

    localStorage.setItem("journals", JSON.stringify(journals));

    updateStreak(today);

    alert("Journal Saved ✅");
    document.getElementById("journalEntry").value = "";
}

// -------- STREAK SYSTEM --------
function updateStreak(today) {

    let lastDate = localStorage.getItem("lastJournalDate");
    let streak = parseInt(localStorage.getItem("journalStreak")) || 0;

    const yesterday = new Date();
    yesterday.setDate(yesterday.getDate() - 1);
    const yesterdayStr = yesterday.toDateString();

    if(lastDate === yesterdayStr){
        streak += 1;
    }
    else if(lastDate !== today){
        streak = 1;
    }

    localStorage.setItem("journalStreak", streak);
    localStorage.setItem("lastJournalDate", today);

    displayStreak();
}

function displayStreak(){
    let streak = localStorage.getItem("journalStreak") || 0;
    document.getElementById("streakCount").innerText = streak + " Days";
}

// -------- NOTIFICATION REMINDER --------
function requestNotificationPermission(){
    if("Notification" in window){
        Notification.requestPermission();
    }
}

function sendReminder(){
    if(Notification.permission === "granted"){
        new Notification("Aura Reminder 🌿", {
            body: "Take 2 minutes to write your gratitude journal today."
        });
    }
}

// Send reminder after 10 seconds (demo purpose)
setTimeout(sendReminder, 10000);

// -------- PAGE LOAD --------
window.onload = function(){
    loadQuote();
    displayStreak();
    requestNotificationPermission();
}

</script>

</body>
</html>
